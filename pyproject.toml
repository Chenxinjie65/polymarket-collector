[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-collector"
version = "0.1.0"
description = "Minimal Polymarket public data collector MVP"
requires-python = ">=3.12"
dependencies = [
  "psutil>=5.9,<8",
  "requests>=2.31,<3",
  "websockets>=13,<16",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
pyclob = [
  "py-clob-client>=0.25,<1",
]
parquet = [
  "pyarrow>=16,<22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
